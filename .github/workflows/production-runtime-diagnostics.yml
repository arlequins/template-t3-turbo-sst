name: Production Lambda runtime diagnostics

on:
  workflow_dispatch:
    inputs:
      application:
        description: Lambda application whose logs should be inspected
        required: true
        type: choice
        options: [api, batch]
      deployment_run_id:
        description: Failed deployment workflow run ID to diagnose
        required: true
        type: string
      confirm:
        description: Type production to acknowledge this protected operation
        required: true
        type: choice
        options: [production]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: template-production-runtime-diagnostics
      cancel-in-progress: false
    env:
      APPLICATION: ${{ inputs.application }}
      CONFIRM: ${{ inputs.confirm }}
      DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./tooling/github/setup

      - name: Require a specific failed deployment
        run: |
          set -euo pipefail
          test "$CONFIRM" = production
          case "$DEPLOYMENT_RUN_ID" in
            *[!0-9]*|'') exit 1 ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read redacted Lambda diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_started_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOYMENT_RUN_ID" --jq '.run_started_at')"
          test -n "$run_started_at"
          start_time="$(date --date="$run_started_at - 5 minutes" +%s000)"
          end_time="$(date --date="$run_started_at + 20 minutes" +%s000)"
          log_prefix="/aws/lambda/${APPLICATION}-production-"
          mapfile -t log_groups < <(
            aws logs describe-log-groups \
              --log-group-name-prefix "$log_prefix" \
              --query 'logGroups[].logGroupName' \
              --output text | tr '\t' '\n'
          )
          if test "${#log_groups[@]}" -eq 0; then
            echo "No matching log groups for $log_prefix"
            exit 0
          fi
          for log_group in "${log_groups[@]}"; do
            output_file="$RUNNER_TEMP/$(basename "$log_group").json"
            umask 077
            aws logs filter-log-events \
              --log-group-name "$log_group" \
              --start-time "$start_time" \
              --end-time "$end_time" \
              --limit 200 \
              --output json > "$output_file"
            node scripts/print-lambda-runtime-diagnostics.mjs "$log_group" < "$output_file"
            rm -f "$output_file"
          done

      - name: Record diagnostic boundary
        run: |
          {
            echo "### Production Lambda runtime diagnostics"
            echo "Read only filtered ${APPLICATION} Lambda events around deployment run \`$DEPLOYMENT_RUN_ID\`."
            echo "Event messages were redacted before output and were not uploaded as artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
